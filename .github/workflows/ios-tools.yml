name: ios-tools

# Programs for the S7's iOS userland (tools/ios/*.c), built with the
# runner's iPhoneOS SDK for plain arm64 (the iPhone X userland has no
# arm64e; the S7's cores have no pointer authentication) and ad-hoc
# signed. They reach the phone through the kernel's USERDATA drop zone
# (tools/herolte-drop.py). Nothing of Apple's is in the artifact.

on:
  workflow_dispatch:
  push:
    branches: [herolte]
    paths:
      - "tools/ios/**"
      - "tools/ios18/**"
      - ".github/workflows/ios-tools.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -euo pipefail
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p out
          for src in tools/ios/*.c; do
            name=$(basename "$src" .c)
            xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -isysroot "$sdk" \
              -O2 -Wall -Wextra -Wno-unused-parameter -o "out/$name" "$src" \
              -framework IOKit -framework CoreFoundation
            codesign -s - -f "out/$name"
            file "out/$name"
          done
      - name: v80stress-r (LSE/RCpc rewritten to routines by tools/ios18/v80strip.py)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages capstone
          python3 tools/ios18/v80strip.py --dump 40 out/v80stress out/v80stress-r | tee strip.txt
          python3 - strip.txt <<'PY'
          import sys, capstone
          md = capstone.Cs(capstone.CS_ARCH_ARM64, capstone.CS_MODE_ARM)
          for line in open(sys.argv[1]):
              if not line.startswith('site '):
                  continue
              head, words = line.split(': ', 1)
              _, site, w, _, _, at = head.split()
              site, at = int(site, 16), int(at, 16)
              orig = next(md.disasm(int(w, 16).to_bytes(4, 'little'), site))
              print(f'{head}   ({orig.mnemonic} {orig.op_str})')
              code = b''.join(int(x, 16).to_bytes(4, 'little') for x in words.split())
              for i in md.disasm(code, at):
                  print(f'    {i.address:#x}: {i.mnemonic} {i.op_str}')
          PY
          python3 tools/ios18/v80strip.py --scan out/v80stress-r || true
          codesign -s - -f out/v80stress-r
          shasum -a 256 out/* | tee out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ios-tools
          path: out/

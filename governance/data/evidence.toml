title = "min107 (banco de aperturas, D-0117): sin pánico del kernel, 54 aperturas (6 iconos × 3 topes × 3 rondas), el Director informa de que se pasó del tiempo y dejó el teléfono en la pantalla de inicio; (1) LOS DOS ICONOS DEL DOCK (y 2340) NO ABRIERON NADA (0 de 9 por tope): la sonda de min106 los vio reaccionar a y 2230 (x 180) y y 2450 (x 540) pero no a 2340, así que su posición real está mal estimada; (2) EL TIEMPO DE ASENTAMIENTO NO DEPENDE DEL TOPE dentro de la resolución de la medida (100 ms de espera y ventanas de 300 ms): icono 0 y icono 1 1300 ms con los tres topes (nueve de nueve valores 1300, salvo un 3000 a 2288), iconos 2 y 3 2600, 2600 y 2500 ms (medianas por tope 2600 a 1664 y 1976, 2500 a 2288); mediana global por tope 2500 (2288), 1900 (1976), 1950 (1664) ms; (3) CORRIENTE DEL ESCENARIO: 1067 mA (2288 MHz, 15 muestras), 854 (1976, 16) y 854 (1664, 16): 2288 cuesta +25 % y 1664 = 1976, tercer arranque que lo muestra (E-0325, E-0326); (4) LOS ICONOS 0 Y 1 NO ESTÁN MIDIENDO UNA APERTURA: en el registro hay 33 cierres por señal 6, de ellos 30 de assetsd (el demonio de la fototeca), 2 de MobileSlideShow (Fotos) y 1 de PhotosFileProvider; los tiempos constantes de 1300 ms con los tres topes son compatibles con una app que se abre, se cierra y vuelve a la pantalla de inicio (hipótesis, sin comprobar qué icono es cuál); (5) cada cierre de assetsd lo relanza el sistema, y eso es trabajo continuo en segundo plano que puede inflar la corriente de todas las medidas de este arranque por igual. CONSECUENCIAS: con tres arranques (E-0325, E-0326, E-0327/E-0328) el tope de 1976 MHz queda como el mejor compromiso medido: la fluidez y los tiempos de asentamiento no mejoran con 2288 y su corriente es entre un 10 % y un 25 % mayor, y 1664 no ahorra corriente y satura más en el paginado; LÍMITES: el asentamiento mide cuánto dibuja iOS, no la latencia hasta el primer fotograma útil; no se sabe qué apps son; sin comparar el gobernador v2 con un tope fijo"

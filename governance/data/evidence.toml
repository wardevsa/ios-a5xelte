[[evidence]]
id = "E-0332"
title = "min110 (muestreador de solo lectura de la PMU, D-0121): SIN PÁNICO y LA PMU DE LOS NÚCLEOS GRANDES FUNCIONA DESDE EL KERNEL EN EL1: ID_AA64DFR0_EL1 = 0x10305116 (PMUVer 1: PMUv3), PMCR_EL0 = 0x53013000 (IDcode 0x53 Samsung, N = 6 contadores de eventos), PMCEID0 = 0xffffffff (los 32 eventos comunes 0x00-0x1f implementados) y PMCEID1 = 0x1; 220 muestras de 2 s con ciclos, instrucciones retiradas, fallos de L1D y de L2D y accesos a bus de los cuatro núcleos (646 filas núcleo-ventana con más de 5 millones de ciclos); RESULTADOS: (1) las instrucciones por ciclo (IPC) de los núcleos Mongoose son BAJAS: mediana 0,36 a 1352 MHz, 0,53 a 1664, 0,56 a 1976 y 0,58 a 2288 (n=3), con p10 a p90 de 0,44 a unos 0,6 a 1976 MHz; (2) el IPC sube con la frecuencia, lo contrario de lo que haría una carga limitada por memoria si se mirara la misma carga a otra frecuencia, pero NO es esa comparación: a 1352 MHz las muestras son de actividad de fondo con ocupación de 9 por mil y 12,2 fallos de L2 por mil instrucciones (caches frías), y a 1976 MHz de carga de uso con 407 por mil y 5,5 fallos de L2 por mil instrucciones: el IPC sigue al tipo de carga y no a la frecuencia; (3) correlaciones sobre filas con 1352 MHz o más (n = 622): ocupación frente a IPC +0,17, ocupación frente a fallos de L2 por mil instrucciones -0,68, IPC frente a fallos de L2 -0,44; (4) la ocupación medida por el kernel y la medida por ciclos no detenidos (ciclos entre 2 s y la frecuencia) coinciden (407 y 435 por mil a 1976 MHz, 298 y 524 a 1664, 12 y 76 a 728): los ciclos de espera de memoria cuentan como ocupados, como se suponía; (5) el rango de IPC a la misma frecuencia es estrecho (0,44 a 0,6 a 1976 MHz), así que el IPC por sí solo NO separa con claridad cómputo de espera de memoria en esta carga; los fallos de L2 por mil instrucciones varían más y siguen a la ocupación; (6) ALGUNAS FILAS TIENEN UN IPC ABSURDO (más de 6000 millones) por una diferencia de contador sin signo cuando un contador de eventos se reinicia sin que lo haga el de ciclos tras un apagado de núcleo; el análisis las descarta (se filtran con IPC menor de 4) y el parche siguiente lo detecta en el kernel. CONCLUSIÓN: la hipótesis (la memoria infla la ocupación) NO se confirma ni se descarta: la PMU sirve y da una señal, pero con esta carga el IPC no discrimina; la pregunta decisiva es si la CANTIDAD DE TRABAJO (instrucciones por segundo) de una carga de uso sube con la frecuencia, y eso se mide con topes fijos de 1352, 1664, 1976 y 2288 MHz y la PMU en el mismo arranque. LÍMITES: una sola sesión; filas con distinta carga mezcladas; el cruce de llamadas despierta núcleos cada 2 s; frecuencias 728 y 2288 casi sin muestras"

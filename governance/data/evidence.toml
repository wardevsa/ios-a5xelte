l instrucciones 6,5, 6,1, 6,0 y 6,1 (constantes). CORRECCIONES Y CONSECUENCIAS: (a) E-0325/E-0326/E-0328 decían que 1664 no ahorra corriente y que la fluidez no depende del tope: eso se midió con TOPES DEL GOBERNADOR v2 (que puede bajar por debajo del tope entre gestos), no con frecuencia fija; con frecuencia fija la corriente del paginado baja un 9 % por escalón y la fluidez sí cambia, así que aquellas frases solo valen para topes del v2; (b) el tope de 1976 MHz sigue siendo un buen punto porque está justo después de la rodilla de fluidez, y 2288 compra una tercera parte menos de intervalos largos por un 8 % más de corriente (no significativo con 4 ejecuciones); (c) la explicación del fracaso del v2 NO es la espera de memoria: es que cambia de nivel con frecuencia (131 cambios en un paginado) y cada subida llega tarde al trabajo que ya se pidió; LÍMITES: cuatro ejecuciones por celda, una sola sesión con el teléfono caliente (la temperatura reducida a 26,8 no es de fiar), el guion es de tiempo fijo (el trabajo pedido no depende de lo rápido que se va), solo paginado y búsqueda"

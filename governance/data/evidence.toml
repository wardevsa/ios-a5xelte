title = "PETICIÓN DEL DIRECTOR: 'can you create an mp3 reproductor or search one and install it' (Archivos sigue dando 'Content Unavailable'): (1) LA SONDA DE E-0410 MURIÓ: el censo de hero-run abortó ('CRASH autorun[93] sig 6'; registro unificado: '*** Terminating app due to uncaught exception NSInvalidArgumentException, reason: -[_LSDataBackedPropertyList objectForKey:]: unrecognized selector'): el objeto 'entitlements' de un LSApplicationExtensionRecord es un _LSDataBackedPropertyList que no tiene objectForKey: (mi error: no comprobé el selector); corregido (usa objectForKeyedSubscript: solo si responde, y si no imprime el texto de los entitlements); (2) NO SE BUSCÓ UN REPRODUCTOR AJENO (instalar uno de terceros exige compilarlo desde código abierto en la CI y verificar su licencia y su dependencia de Metal/SpriteKit; no hay IPAs descifrados en el repositorio): se escribió uno propio, mínimo y sin dependencias raras: apps/s7ge-player (S7GE Player, UIKit + AVFoundation, AVAudioPlayer): busca audio (mp3, m4a, aac, wav, aif, caf, flac) en su carpeta Documents, en las descargas de Safari (Containers/Data/Application/*/Library/Safari/Downloads/*), en Media/Downloads y en Media/Books (aquí NADA está en un sandbox, por eso puede leer la carpeta de otra app), lista los archivos, reproduce con play/pausa, anterior/siguiente y barra para moverse, y escribe lo encontrado y cada error en /private/var/tmp/s7ge-player.txt; (3) la CI de apps (45031651953) y la de userland (45031598261) pasaron; DROP 62 de 80 (sin BOOT): autorun con la sonda corregida y S7GEPlayer.app; LÍMITES, DICHOS: (a) no se sabe si el decodificador de MP3 del teléfono va por AudioToolbox (el registro de E-0399 mostraba ACMP4AACBaseDecoder en uso al reproducir en Safari, así que al menos AAC sí); (b) el audio sale por el plug-in HakiosAudio: sonó en pruebas anteriores (24000 tramas), el volumen se cambia con los botones; (c) es una app nueva: LaunchServices la registrará en el SIGUIENTE arranque (el registro en caliente falla, E-0392), que reconstruye su base y tarda varios minutos; (d) el icono será el genérico (sin imagen); contadores D-0123: BOOT 24 de 80, DROP 62 de 80"

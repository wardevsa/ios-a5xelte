[[evidence]]
id = "E-0329"
title = "min108 (gobernador v2 frente a tope fijo a 1976 MHz, mismo arranque, D-0118): sin pánico del kernel, 16 ejecuciones (2 modos × 2 escenarios × 4 rondas alternadas ABBAABBA); EL GOBERNADOR NO APORTA FRENTE AL TOPE FIJO: paginado 1351 mA gobernado (8 muestras) frente a 1363 fijo (8): -0,9 %, indistinguible, con un reparto de intervalos peor en el gobernado (el 23,7 % de 120 ms o más frente al 14,2 % del fijo), 131 cambios de reloj y 28 muestras saturadas de 1900 frente a 0 cambios y 44 de 1920; búsqueda 857 mA frente a 914 (-6 %, 6 y 5 muestras, dentro del ruido, ya que una ejecución individual varía de 662 a 1330 mA) con el mismo espaciado (54,1 % y 59,4 % bajo 40 ms, 11,9 % y 11,7 % de 120 ms o más) y 62 cambios de reloj; la corriente por ejecución del mismo modo varía más que la diferencia entre modos (paginado gobernado 1238 a 1528, fijo 1080 a 1452). CONSECUENCIA: con la carga de estos escenarios (paginado y búsqueda con el panel encendido) el gobernador v2 no ahorra corriente medible y empeora el reparto de intervalos del paginado; el ahorro del v2 sólo podría estar en el reposo con la pantalla encendida (el reposo ya vale ~618 mA con cualquier tope, E-0325) y en los cambios de carga que este guion no produce. DECISIÓN QUE SE PROPONE: S7PM v1 queda cerrada con tope fijo de 1976 MHz (min100) y el gobernador v2 pasa a investigación. LÍMITES: 4 ejecuciones por celda, 5 a 8 muestras de corriente por celda, una sola sesión; no cubre juegos ni cargas largas"

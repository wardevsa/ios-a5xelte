# Registro de decisiones (fuente de verdad; la vista legible es DECISIONS.md, generada).
# Reglas (comprobadas por `python3 tools/governance.py check`):
#  - APPROVED exige approved_by, approval_date y approval_ref (dónde consta la aprobación) y que ese rol pueda aprobar ese ámbito (policy.toml).
#  - El ingeniero nunca aprueba sus propias propuestas; el jefe técnico y el director sí pueden aprobar lo que definen dentro de su ámbito.
#  - Una decisión PROPOSED no tiene efecto. Una acción de nivel C solo se ejecuta con una decisión APPROVED del director (authorization_ref en la tarea).
#  - Las decisiones no se editan para cambiar su sentido: se añade otra que la sustituye (supersedes).

[[decision]]
id = "D-0001"
title = "Sistema de gobierno de ingeniería autónoma (carpeta governance/, herramienta tools/governance.py)"
date = "2026-11-13"
scope = "process"
status = "PROPOSED"
proposer = "ingeniero"
rationale = "La Misión 0 pide una estructura permanente y verificable para continuar el proyecto entre sesiones y modelos. Se implanta como propuesta: ningún modelo debe darla por aprobada hasta que la revise el jefe técnico y la ratifique el director."
consequences = "Si se aprueba, las reglas de AUTONOMY_POLICY.md y policy.toml pasan a vincular a cualquier ingeniero que trabaje en el repositorio. Si se rechaza, se retira la carpeta y el puntero de AGENTS.md."
reversal = "git revert del commit de implantación; quitar el puntero a governance/ en AGENTS.md."
review = "Jefatura técnica (Qwen, directiva del 2026-11-13) la ratifica y pide marcarla APPROVED. Una política, la jerarquía y AGENTS.md los aprueba el DIRECTOR (AUTHORITY.md §2) y la herramienta lo exige a quien consuma esta decisión: sigue PROPUESTA hasta que el Director la confirme con sus palabras. Pendiente además: AUTHORITY.md nombra ChatGPT como jefe técnico y la directiva viene firmada por Qwen; el Director debe confirmar quién ocupa el puesto."

[[decision]]
id = "D-0002"
title = "Política de almacenamiento: ext4 para trabajo activo, NTFS para archivo histórico; NTFS nunca como scratchpad de Claude"
date = "2026-11-13"
scope = "policy"
status = "APPROVED"
proposer = "ingeniero"
approved_by = "director"
approval_date = "2026-11-13"
approval_ref = "Mensaje del Director 'Recuperar espacio real y completar la organización' (apartado 4, configuración permanente), 2026-11-13; documento IOS-S7-archive/05-manifests-and-hashes/POLITICA_ALMACENAMIENTO.md"
rationale = "El disco raíz llegó a 0 bytes libres; ntfs3 no conserva propietarios, nlink ni modos que las pruebas necesitan."
consequences = "Los scratchpads son efímeros (viven en /tmp): lo que importe se archiva en el NTFS con tar+compare+SHA-256 y se indexa en evidence.toml."
reversal = "Nueva decisión que la sustituya."

[[decision]]
id = "D-0003"
title = "Dirección de S7GE: Metal como interfaz principal, IR común S7GIR, backend Midgard específico T880, OpenGL ES como API adicional, GPU física como ruta objetivo"
date = "2026-11-13"
scope = "architecture"
status = "APPROVED"
proposer = "jefe-tecnico"
approved_by = "jefe-tecnico"
approval_date = "2026-11-13"
approval_ref = "S7GE_ARCHITECTURE.md Parte XXII 'Decisiones oficiales de dirección' (el jefe técnico define la arquitectura); el Director lo recibió y ordenó conservarlo para el proyecto el 2026-11-13. No es una autorización de ninguna acción de nivel C"
rationale = "Fijada por la dirección técnica como objetivo, no como implementación. El estado real del árbol (S7GE_STATUS.md) matiza el punto de partida: hoy acelera OpenGL ES vía EAGL/OSMesa/Panfrost y no existe proveedor de Metal."
consequences = "Aprobada como DIRECCIÓN. No autoriza escribir registros de GPU ni sustituir la ruta de presentación existente (el propio documento lo excluye)."
reversal = "Nueva decisión de arquitectura que la sustituya."

[[decision]]
id = "D-0004"
title = "Criterios de la candidata N2 de solo lectura: sin ufsrw/rootrw distintos de =0, con ufsrw=0 herolog=0 herodrop=0 explícitos, verificada con herolte-verify-boot.py --profile n2-readonly"
date = "2026-11-13"
scope = "process"
status = "APPROVED"
proposer = "ingeniero"
approved_by = "director"
approval_date = "2026-11-13"
approval_ref = "Mensaje del Director 'cerrar correctamente el verificador BOOT y producir una candidata N2 inequívocamente de solo lectura', 2026-11-13"
rationale = "En el driver UFS, writable = (ufsrw != 0): cualquier valor distinto de exactamente 0 habilita escrituras."
consequences = "Construir la candidata NO autoriza escribirla en el teléfono: eso es la acción device-write-boot (nivel C)."
reversal = "Nueva decisión; el verificador y sus pruebas codifican la regla."

[[decision]]
id = "D-0005"
title = "El experimento R2 (monta imágenes, usa sudo) no está autorizado"
date = "2026-11-13"
scope = "operation"
status = "APPROVED"
proposer = "ingeniero"
approved_by = "director"
approval_date = "2026-11-13"
approval_ref = "Restricciones reiteradas del Director en todos los mensajes de la serie T04-R2/Unicode: 'No ejecutes R2', 'No autorices R2', 'No monta imágenes'"
rationale = "Falta validar el ejecutor rev2 (ronda 2 de mutación pendiente) y su revisión independiente nueva."
consequences = "T-0004 queda bloqueada hasta una decisión APPROVED del director que la autorice, acotada a comandos concretos."
reversal = "Una decisión posterior del director que autorice R2 y cite la lista exacta de comandos."

[[decision]]
id = "D-0006"
title = "Generación del root: no cambiar el generador ni regenerar lab-full.img.partial hasta decidir sobre el bloqueo Unicode"
date = "2026-11-13"
scope = "operation"
status = "APPROVED"
proposer = "ingeniero"
approved_by = "director"
approval_date = "2026-11-13"
approval_ref = "Mensajes del Director 'Espera mi decisión antes de implementar cambios que afecten a la generación del root filesystem' y 'No repares, regeneres ni sustituyas esa imagen todavía', 2026-11-13"
rationale = "Hay 32 nombres Unicode que Linux escribió distinto de XNU (docs/herolte-unicode-hfsplus.md); las opciones son la corrección 1-5, la alternativa (B) o la (C)."
consequences = "T-0003 es una decisión pendiente; hasta entonces el generador y la imagen de laboratorio no cambian."
reversal = "Decisión del director que elija una de las opciones."

[[decision]]
id = "D-0007"
title = "Reservar el rango de parches 0400+ para S7GE (el 0300-0309 propuesto en S7GE_ARCHITECTURE.md ya está ocupado)"
date = "2026-11-13"
scope = "architecture"
status = "PROPOSED"
proposer = "ingeniero"
rationale = "0300-0335 existen en el árbol (0301 audio, 0307 L3 de GPU, 0317 WebKit...). Reutilizar números rompe aplicabilidad y trazabilidad."
consequences = "Los nombres de parche de S7GE empezarían en 0400. Requiere revisión del jefe técnico porque toca la numeración de la serie."
reversal = "Renombrar los parches S7GE; no hay ninguno creado todavía."

[[decision]]
id = "D-0008"
title = "Renumerar nuestros 0332 (marcador DROP), 0334 (DROP v2) y 0335 (splash) antes de fusionar con origin/herolte, que ya usa 0332-0334 para gráficos"
date = "2026-11-13"
scope = "architecture"
status = "SUPERSEDED"
proposer = "ingeniero"
rationale = "origin/herolte (2026-11-13) tiene 0332-surface-wrap, 0333-gpu-wait-asleep y 0334-present-wait-asleep. Colisión de números con ramas distintas del mismo proyecto."
consequences = "Cambia nombres de fichero, no contenido; el kernel de la candidata N2 (construido con nuestro 0334) no cambia, pero habría que reconstruirlo y reverificar la imagen si se rehace sobre la nueva serie."
reversal = "Revertir el renombrado antes de publicar."

[[decision]]
id = "D-0009"
title = "Ratificar las decisiones D1-D12 de DROP v2 de xnu/drop-v2/DECISIONES.md, tomadas por el jefe de proyecto suplente"
date = "2026-11-13"
scope = "architecture"
status = "PROPOSED"
proposer = "ingeniero"
rationale = "Ese documento dice que sus decisiones están 'pendientes de ratificación por el responsable del proyecto'. El sistema de gobierno distingue propuesta de decisión aprobada."
consequences = "Hasta la ratificación, DROP v2 se trata como propuesta madura, no como diseño aprobado."
reversal = "Rechazar o sustituir las decisiones individuales."

[[decision]]
id = "D-0010"
title = "Escribir en BOOT del S7 (peldaños N1/N2) requiere una autorización C específica; la candidata verificada del PC no la sustituye"
date = "2026-11-13"
scope = "operation"
status = "APPROVED"
proposer = "ingeniero"
approved_by = "director"
approval_date = "2026-11-13"
approval_ref = "Mensaje del Director 'Todavía NO hemos comenzado las pruebas reales en el Galaxy S7... No confundas imágenes generadas con un arranque real', 2026-11-13; AGENTS.md (solo BOOT)"
rationale = "Nada se ha probado en hardware: las candidatas pasan comprobaciones de consistencia del PC, no arrancan."

valid_until = "2026-11-17"
rationale = "El primer arranque con raíz iOS (E-0181) reconoce el volumen HFS+ pero falla al inicializar el diario porque el UFS está en solo lectura (ufsrw=0). El kernel solo escribe dentro de USERDATA (herolte_ufs.c)."

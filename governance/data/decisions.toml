[[decision]]
id = "D-0023"
title = "Autorización roja de un solo uso: borrar de ext4 los 224 sandboxes ya archivados en NTFS (T-0007)"
date = "2026-11-13"
scope = "operation"
status = "APPROVED"
proposer = "jefe-tecnico"
approved_by = "director"
approval_date = "2026-11-13"
approval_ref = "Mensaje del Director (pioxi), 2026-11-13: 'Yo el director pioxi, autorizo el siguiente informe' (directiva de jefatura técnica: nivel NARANJA, autorización de T-0007, copia de scripts del laboratorio y continuación de T-0025)"

[[decision]]
id = "D-0022"
title = "Reformulación de niveles: nuevo nivel NARANJA (la jefatura técnica puede autorizar operaciones privilegiadas de host) y ROJO CRÍTICO solo para el dispositivo físico"
date = "2026-11-13"
scope = "policy"
status = "SUPERSEDED"
proposer = "jefe-tecnico"
approved_by = "director"
approval_date = "2026-11-13"
approval_ref = "Mensaje del Director (pioxi), 2026-11-13: 'Yo el director pioxi, autorizo el siguiente informe' (directiva de jefatura técnica: nivel NARANJA, autorización de T-0007, copia de scripts del laboratorio y continuación de T-0025)"
rationale = "El sistema de niveles resultaba demasiado burocrático para operaciones rutinarias de desarrollo."
consequences = "Nivel NARANJA (autorizador: jefatura técnica): sudo y montaje en el host, compilación pesada, generación de imágenes de prueba, uso intensivo de recursos, sin tocar el dispositivo. ROJO CRÍTICO (solo Director): flashear el S7, particiones reales, bootloader o firmware, borrar datos del dispositivo, toda operación física irreversible. La directiva NO reclasifica el borrado de ficheros del host ni la publicación (push/CI): el ingeniero los mantiene en rojo hasta que se diga lo contrario. AGENTS.md sigue mandando (EFS, RECOVERY y bootloader no se escriben nunca)."
reversal = "Nueva decisión del Director; restaurar policy.toml anterior (git revert)."


[[decision]]
id = "D-0011"
title = "Mecanismo de autorización roja y de revisión amarilla: authorizes + valid_until + gate; review_ref antes de pasar a done"
date = "2026-11-13"
scope = "process"
status = "PROPOSED"
proposer = "ingeniero"
rationale = "La auditoría de tools/governance.py (F-09, F-10) encontró que cualquier decisión del director servía de autorización para cualquier acción roja y que una tarea amarilla podía pasar a done sin revisión. La corrección exige que la decisión nombre la acción, sea vigente y del director, y que lo amarillo tenga review_ref del revisor que fija la política."
consequences = "Cambia cómo se registran las autorizaciones del Director (campo authorizes en decisions.toml) y las revisiones del jefe técnico (review_ref en tasks.toml). Ninguna herramienta ejecuta nada por ello."
reversal = "Quitar los campos y las comprobaciones de tools/governance.py (git revert)."

[[decision]]
id = "D-0012"
title = "Los niveles de evidencia (domain, level, device) se declaran y nunca se elevan automáticamente; una suite del PC no puede declarar hardware"
date = "2026-11-13"
scope = "process"
status = "PROPOSED"
proposer = "ingeniero"
rationale = "El director pidió separar pruebas del host, compilación, GPU física e integración iOS y prohibió elevar un nivel automáticamente (F-13). Se codifica en el esquema de evidence.toml y regression.toml y en check."
consequences = "Toda evidencia nueva debe llevar dominio, nivel y dispositivo; una tarea puede exigir min_evidence (p. ej. L3 en this-unit para las pruebas en el S7)."
reversal = "Retirar los campos y las reglas de check."

[[decision]]
id = "D-0013"
title = "Alinear los permisos de Claude Code (settings.json) con policy.toml para convertir la disciplina asistida en un control técnico"
date = "2026-11-13"
scope = "policy"
status = "PROPOSED"
proposer = "ingeniero"
rationale = "La herramienta informa pero no puede impedir que un agente ejecute un comando (KI-0004, límite 1 de la auditoría). Solo la configuración de permisos del propio agente lo impide."
consequences = "Requiere cambiar la configuración del agente: acción roja host-config-change; no se ha tocado."
reversal = "Restaurar el settings.json anterior (copia previa obligatoria)."

[[decision]]
id = "D-0014"
title = "Renumerar solo los dos parches nuestros que colisionan con origin/herolte (0332 marcador -> 0336, 0334 DROP v2 -> 0337, manteniendo el orden relativo) y hacer que ci_check/preflight identifiquen el parche por nombre completo"
date = "2026-11-13"
scope = "architecture"
status = "PROPOSED"
proposer = "ingeniero"
supersedes = ["D-0008"]
rationale = "T-0009 midió que solo colisionan 0332 y 0334 (upstream no usa 0335, que D-0008 daba por colisión) y que los 5 parches aplican en ambos órdenes sin pisarse. El riesgo real es de identificación: el prefijo 0334- de ci_check.py casa con el parche de DROP v2 y con present-wait-asleep de upstream, y podría dar un falso 'aplicado'. Informe: docs/herolte-integracion-origin-herolte.md (E-0024)."
consequences = "Cambia nombres de dos ficheros de la serie y unas 25 referencias documentales/herramientas (no los nombres de artefacto kernel-0334-*). El kernel de la candidata N2 no cambia por el renombrado, pero sí si se fusiona y reconstruye con 0332-0334 de upstream; entonces la candidata N2 se regenera con nombre nuevo y se reverifica."
reversal = "git revert de los renombrados antes de publicar."

[[decision]]
id = "D-0015"
title = "Aislamiento de clientes de HeroGPU: address space por cliente, jc_va validada contra los BO del cliente, entitlement en initWithTask, presupuesto de memoria y SurfaceBO con comprobación de propiedad"
date = "2026-11-13"
scope = "architecture"
status = "PROPOSED"
proposer = "ingeniero"
rationale = "docs/S7GE_ABI.md (T-0008) leyó HeroGPU.cpp y herolte_gpu.c y encontró: una sola AS0 compartida por todos los clientes, Submit con la VA de la cadena de jobs aportada por el cliente y sin validar, ningún entitlement ni presupuesto de memoria, SurfaceBO con búsqueda global por id y handles sin generación. Incumple los principios 2.5 y 23 de S7GE. T-0010 (docs/S7GE_HARDWARE.md §3) añade, por lectura de código y sin prueba en hardware, que el bloque de trabajo de 2 MiB mapeado RW en AS0 contiene la tabla L2 de los búferes de usuario y las L3 de presentación: un job podría reescribirlas y alcanzar memoria física arbitraria."
consequences = "Es una modificación del kernel y de la serie de parches (nivel B, revisor jefe técnico): se haría con una tarea nueva y tras esa revisión. Hasta entonces la GPU solo debe usarla software del proyecto en el teléfono de pruebas."
reversal = "Es una propuesta; si se implementa, git revert del parche."

[[decision]]
id = "D-0016"
title = "Cargador de las pruebas: usar el compilado con clang (loader-clang/, E-0008); no ejecutar el GCC descargado"
date = "2026-11-13"
scope = "architecture"
status = "APPROVED"
proposer = "ingeniero"
approved_by = "jefe-tecnico"
approval_date = "2026-11-13"
approval_ref = "Directiva de jefatura técnica del 2026-11-13 (Qwen, relayada por el Director), apartado 'D-0013: Cargador para xnu_boot: clang'. La directiva la numeró D-0013, que ya existe (permisos de Claude Code): registrada aquí como D-0016. No autoriza ninguna acción de nivel C"
rationale = "clang ya está disponible en ~/HackiOS/builds/device-day/loader-clang/ y se usó en E-0008; no requiere compilar ni ejecutar nada nuevo."
consequences = "T-0013 se cierra sin ninguna acción roja. No autoriza escribir BOOT ni tocar el teléfono. El preflight seguirá avisando de que no hay GCC aarch64: es un aviso conocido y aceptado."
reversal = "Nueva decisión que elija GCC (requeriría host-config-change, roja)."

[[decision]]
id = "D-0017"
title = "Corrección Unicode: regenerar en el generador del root los nombres en forma XNU (sin tocar el kernel), antes de repetir R2"
date = "2026-11-13"
scope = "architecture"
status = "PROPOSED"
proposer = "jefe-tecnico"
rationale = "La directiva de jefatura técnica del 2026-11-13 elige 'Opción 3: regenerar nombres en el generador del root usando la tabla de XNU' (sin cambios de kernel, reversible). La numeró D-0003, que ya es la dirección de S7GE; el texto no mapea con exactitud a las opciones de docs/herolte-unicode-hfsplus.md (1-5, B, C, D): se interpreta como la corrección 1-5 sin la parte del kernel."
consequences = "Cambiar el generador del root es decisión del DIRECTOR (AUTHORITY.md §2) y D-0006 lo mantiene congelado hasta que decida: por eso queda PROPUESTA y T-0003 sigue bloqueada. Además, mi informe (sección 3) recomienda la corrección solo si R2 la confirma, y R2 sigue sin autorizar (D-0005, de nivel rojo): se necesita la confirmación del Director de si acepta aplicarla sin R2 previo."
reversal = "git revert del cambio del generador; las imágenes viejas se conservan (E-0010)."


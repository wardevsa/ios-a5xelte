[[decision]]
id = "D-0011"
title = "Mecanismo de autorización roja y de revisión amarilla: authorizes + valid_until + gate; review_ref antes de pasar a done"
date = "2026-11-13"
scope = "process"
status = "PROPOSED"
proposer = "ingeniero"
rationale = "La auditoría de tools/governance.py (F-09, F-10) encontró que cualquier decisión del director servía de autorización para cualquier acción roja y que una tarea amarilla podía pasar a done sin revisión. La corrección exige que la decisión nombre la acción, sea vigente y del director, y que lo amarillo tenga review_ref del revisor que fija la política."
consequences = "Cambia cómo se registran las autorizaciones del Director (campo authorizes en decisions.toml) y las revisiones del jefe técnico (review_ref en tasks.toml). Ninguna herramienta ejecuta nada por ello."
reversal = "Quitar los campos y las comprobaciones de tools/governance.py (git revert)."


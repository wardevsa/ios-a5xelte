approval_ref = "Mensaje del Director (PioXI), 2026-11-15: 'Autorizo cambiar la línea de arranque de la imagen de prueba a ufsrw=1 rootrw=1 (el resto igual que min16) y lo que necesites. Imagen: xnu-boot-v2-s7-min17-20261115.img, SHA-256 8c98450335f3c7fb9d0f019d57c7f08f6fa79992f0f3ca205f30341404e19bd2. Solo BOOT. Firmado PioXI.' El 'y lo que necesites' lo acoto a los límites de esta decisión."

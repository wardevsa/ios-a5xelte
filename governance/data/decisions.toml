# Registro de decisiones (fuente de verdad; la vista legible es DECISIONS.md, generada).
# Reglas (comprobadas por `python3 tools/governance.py check`):
#  - APPROVED exige approved_by, approval_date y approval_ref (dónde consta la aprobación) y que ese rol pueda aprobar ese ámbito (policy.toml).
#  - El ingeniero nunca aprueba sus propias propuestas; el jefe técnico y el director sí pueden aprobar lo que definen dentro de su ámbito.
#  - Una decisión PROPOSED no tiene efecto. Una acción de nivel C solo se ejecuta con una decisión APPROVED del director (authorization_ref en la tarea).
#  - Las decisiones no se editan para cambiar su sentido: se añade otra que la sustituye (supersedes).

[[decision]]
id = "D-0001"
title = "Sistema de gobierno de ingeniería autónoma (carpeta governance/, herramienta tools/governance.py)"
date = "2026-11-13"
scope = "process"
status = "APPROVED"
proposer = "ingeniero"
approved_by = "director"
approval_date = "2026-11-13"
approval_ref = "Mensaje del Director, 2026-11-13: 'Apruebo D-0001 y D-0017, autorizo cambiar el generador sin R2. Y si, la directiva responde por mi, por razones de seguridad yo seguire leyendo todo para que no haya problemas e intervendre de forma extraordinaria si se requiere.'"
rationale = "La Misión 0 pide una estructura permanente y verificable para continuar el proyecto entre sesiones y modelos. Se implanta como propuesta: ningún modelo debe darla por aprobada hasta que la revise el jefe técnico y la ratifique el director."
consequences = "Si se aprueba, las reglas de AUTONOMY_POLICY.md y policy.toml pasan a vincular a cualquier ingeniero que trabaje en el repositorio. Si se rechaza, se retira la carpeta y el puntero de AGENTS.md."
reversal = "git revert del commit de implantación; quitar el puntero a governance/ en AGENTS.md."
review = "Jefatura técnica (Qwen, directiva del 2026-11-13) la ratifica y pide marcarla APPROVED. Una política, la jerarquía y AGENTS.md los aprueba el DIRECTOR (AUTHORITY.md §2) y la herramienta lo exige a quien consuma esta decisión: sigue PROPUESTA hasta que el Director la confirme con sus palabras. Segunda directiva (Qwen): ratifica D-0001 y confirma que Qwen ocupa el puesto de jefe técnico, alegando autoridad delegada por el Director; esa delegación solo consta dentro del texto pegado, no en palabras del Director ni en AUTHORITY.md. Pendiente además: AUTHORITY.md nombra ChatGPT como jefe técnico y la directiva viene firmada por Qwen; el Director debe confirmar quién ocupa el puesto."

[[decision]]
id = "D-0002"
title = "Política de almacenamiento: ext4 para trabajo activo, NTFS para archivo histórico; NTFS nunca como scratchpad de Claude"
date = "2026-11-13"
scope = "policy"
status = "SUPERSEDED"
proposer = "ingeniero"
approved_by = "director"
approval_date = "2026-11-13"

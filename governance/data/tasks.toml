#          in_review (hecha, espera revisión de quien indica la política), done, cancelled.
# Una tarea con acciones de nivel C solo puede estar in_progress/in_review/done si authorization_ref apunta a una decisión APPROVED del director.
# priority: 1 = la más urgente. depends_on: ids de tareas que deben estar done.

